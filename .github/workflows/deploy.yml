name: Deploy to Byet.Host

# Live project URL: https://logiclab.byethost15.com/studio-panel/

# Trigger workflow on push to main branch
on:
  push:
    branches:
      - demo_c1

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Deploy via plain FTP to Byet.Host
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net           # Byet.Host FTP server
          username: b32_40409860          # replace with your FTP username
          password: ${{ secrets.FTP_PASSWORD_C1 }}
          protocol: ftp                   # force plain FTP
          port: 21
          local-dir: ./                   # root of your repository
          server-dir: /logiclabinnovations.22web.org/htdocs/  # target directory for logiclab.byethost15.com/studio-panel
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            **/README.md
            **/deploy.yml
